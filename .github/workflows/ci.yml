on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

name: CI

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: jez500/pricebuddy-tests-8.4:latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tests_db
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      -
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
      -
        name: Install composer dependencies
        run: |
          composer install --no-scripts
      -
        name: Install front-end dependencies
        run: |
          npm install
          npm run build
      -
        name: Prepare Laravel Application
        run: |
          cp .env.ci .env
          php artisan key:generate
      -
        name: Check coding standards
        run: vendor/bin/pint --test -vv
      -
        name: Static code analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      -
        name: Run Testsuite
        run: |
          sed -i -e 's/tests_db/mysql/g' phpunit.xml
          php -d memory_limit=512M artisan test -p

  # PriceBuddies: publish to GitHub Container Registry (no Docker Hub account needed)
  docker_build_push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        uses: actions/checkout@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Update version file
        run: echo "${{ github.ref_name }}" > VERSION
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ./docker/php.dockerfile
          # Docker v2 media types (not OCI): Unraid's update check compares the digest of a
          # Docker v2 manifest and keeps reporting "update available" for OCI manifests.
          outputs: type=image,push=true,oci-mediatypes=false
          # Plain single-platform manifest: with provenance/SBOM attestations the image is an
          # OCI index whose digest Unraid never matches, so it keeps showing "update available".
          provenance: false
          sbom: false
          tags: |
            ghcr.io/starf0x/pricebuddies:${{ github.ref_name }}
            ghcr.io/starf0x/pricebuddies:latest
          build-args: |
            APP_VERSION=${{ github.ref_name }}
